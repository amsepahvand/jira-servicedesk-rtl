@font-face{font-family:V;src:url(vazirmatn-variable.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:transparent}
.i{width:512px;height:512px;border-radius:120px;background:linear-gradient(135deg,#0b7f86,#13396e);position:relative;overflow:hidden}
.i::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 200px at 30% 12%,rgba(255,255,255,.22),transparent 70%)}
.b{position:absolute;left:92px;top:104px;width:328px;height:240px;border-radius:56px;background:#fff;box-shadow:0 18px 40px rgba(4,20,40,.28)}
.b::after{content:"";position:absolute;right:58px;bottom:-54px;border-top:64px solid #fff;border-left:64px solid transparent}
.r{position:absolute;inset:0;display:grid;place-items:center;font:900 250px/1 V;color:#13396e;padding-left:22px;transform:translateY(-44px)}

</style></head><body><div class="i"><div class="b"><div class="r">ر</div></div></div></body></html>
