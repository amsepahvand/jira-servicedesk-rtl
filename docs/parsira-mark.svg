<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2350"/>
      <stop offset=".55" stop-color="#1c4a8a"/>
      <stop offset="1" stop-color="#3a8fd0"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3d78"/>
      <stop offset="1" stop-color="#0c1d45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1cf9a"/>
      <stop offset=".5" stop-color="#d9a05a"/>
      <stop offset="1" stop-color="#c0823f"/>
    </linearGradient>
  </defs>
  <!-- stem of the P -->
  <path d="M112 118 L178 88 L178 404 L112 440 Z" fill="url(#stem)"/>
  <!-- ribbon bowl of the P -->
  <path d="M150 64 H322 C404 64 452 118 452 196 C452 276 398 330 316 330 H244 L244 272 H312 C356 272 386 242 386 198 C386 152 356 122 312 122 H176 C160 122 150 104 150 88 Z" fill="url(#ribbon)"/>
  <!-- speech bubble -->
  <path d="M196 150 H318 C342 150 358 166 358 194 C358 222 342 240 318 240 H250 L210 282 L214 240 C200 236 196 226 196 214 Z" fill="url(#gold)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <!-- three dots in the bubble -->
  <g fill="#0f2350">
    <rect x="232" y="184" width="18" height="18" transform="rotate(45 241 193)"/>
    <rect x="266" y="184" width="18" height="18" transform="rotate(45 275 193)"/>
    <rect x="300" y="184" width="18" height="18" transform="rotate(45 309 193)"/>
  </g>
  <!-- the three dots that make it "پ" -->
  <g fill="#0f2350">
    <rect x="236" y="360" width="34" height="34" transform="rotate(45 253 377)"/>
    <rect x="292" y="360" width="34" height="34" transform="rotate(45 309 377)"/>
    <rect x="264" y="410" width="34" height="34" transform="rotate(45 281 427)"/>
  </g>
</svg>
